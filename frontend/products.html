<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Lista produktów</title>
</head>
<body>
  <h1>Produkty</h1>
  <nav>
    <a href="index.html">Strona główna</a> |
    <a href="stats.html">Statystyki</a>
  </nav>

  <ul id="lista"></ul>

  <h2>Dodaj nowy produkt</h2>
  <form id="formularz">
    <input type="text" id="nowy" placeholder="Nazwa produktu" required>
    <button type="submit">Dodaj</button>
  </form>

  <script>
    const lista = document.getElementById('lista');
    const formularz = document.getElementById('formularz');
    const nowyNazwa = document.getElementById('nowy');

    function wczytaj() {
      fetch('/api/items')
        .then(res => res.json())
        .then(data => {
          lista.innerHTML = '';
          data.forEach(produkt => {
            const li = document.createElement('li');
            li.textContent = produkt;
           lista.appendChild(li);
          });
        });
    }

    formularz.addEventListener('submit', e => {
      e.preventDefault();
      const nowy = nowyNazwa.value.trim();
      if (!nowy) return;

      fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: nowy
      })
      .then(res => res.text())
      .then(msg => {
        alert(msg);
        nowyNazwa.value = '';
        wczytaj();
      });
    });

    wczytaj();
  </script>
</body>
</html>
