name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  NODE_VERSION: 20

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint


  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test > raport.txt

      - name: Raport testów  (Node 20)
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: raport-node20
          path: raport.txt
          retention-days: 7


  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name:  npm run build
        run: npm run build

      - name: Step summary-rozmiar buildu
        run: |
          SIZE=$(du -sh . 2>/dev/null | cut -f1)
          echo "- Build size: $SIZE" >> $GITHUB_STEP_SUMMARY